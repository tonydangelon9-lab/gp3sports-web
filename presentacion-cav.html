<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GP3 CAV · Dossier de Patrocinio 2026</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; font-family:'Titillium Web','Segoe UI',Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; cursor:pointer; }
  #stage img { max-width:100vw; max-height:100vh; width:auto; height:auto; object-fit:contain; user-select:none; -webkit-user-drag:none; }
  /* HUD */
  #hud { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:14px 22px; z-index:10; opacity:0; transition:opacity .25s; background:linear-gradient(0deg, rgba(0,0,0,.65), transparent); }
  body:hover #hud, #hud.show { opacity:1; }
  .hbtn { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:700; letter-spacing:1px; cursor:pointer; text-transform:uppercase; }
  .hbtn:hover { background:rgba(225,6,0,.85); border-color:transparent; }
  #cnt { color:#fff; font-size:15px; font-weight:700; letter-spacing:2px; font-variant-numeric:tabular-nums; }
  #bar { position:fixed; top:0; left:0; height:4px; background:#E10600; z-index:11; transition:width .25s; }
  #hint { position:fixed; top:20px; right:22px; z-index:10; color:#fff; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:10px 16px; font-size:13.5px; letter-spacing:.5px; opacity:0; transition:opacity .4s; pointer-events:none; }
  #hint.show { opacity:1; }
  /* zonas prev/next */
  #prevzone { position:fixed; left:0; top:0; bottom:60px; width:18%; z-index:5; cursor:w-resize; }
  /* gate */
  #gate { position:fixed; inset:0; background:#0C0F14; z-index:50; display:none; align-items:center; justify-content:center; }
  #gate .box { background:#12161d; border:1px solid #232a33; border-radius:12px; padding:36px; width:min(420px, 90vw); text-align:center; }
  #gate h2 { color:#6CACE4; font-size:15px; letter-spacing:3px; text-transform:uppercase; }
  #gate input { width:100%; margin-top:18px; padding:12px; border-radius:8px; border:1px solid #2c343f; background:#0C0F14; color:#fff; font-size:16px; letter-spacing:3px; text-transform:uppercase; text-align:center; outline:none; }
  #gate button { margin-top:14px; width:100%; padding:12px; border:0; border-radius:8px; background:#E10600; color:#fff; font-weight:800; font-size:15px; text-transform:uppercase; letter-spacing:1px; cursor:pointer; }
  #gate .err { color:#ff6b64; font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><img id="lamina" src="" alt="lámina"></div>
<div id="prevzone" title="Anterior"></div>
<div id="hint">→ / clic: avanzar &nbsp;·&nbsp; ←: volver &nbsp;·&nbsp; F: pantalla completa &nbsp;·&nbsp; ESC: salir</div>
<div id="hud">
  <div style="display:flex; gap:10px;">
    <button class="hbtn" onclick="ir(-1);event.stopPropagation();">◀ Anterior</button>
    <button class="hbtn" onclick="ir(1);event.stopPropagation();">Siguiente ▶</button>
  </div>
  <div id="cnt">1 / 11</div>
  <div style="display:flex; gap:10px;">
    <button class="hbtn" onclick="fs();event.stopPropagation();">⛶ Pantalla completa</button>
    <a class="hbtn" style="text-decoration:none;" href="presentaciones.html" onclick="event.stopPropagation();">✕ Salir</a>
  </div>
</div>

<div id="gate"><div class="box">
  <h2>Acceso con clave</h2>
  <input id="clave" type="password" placeholder="CLAVE" onkeydown="if(event.key==='Enter')entrar()">
  <button onclick="entrar()">Entrar</button>
  <div class="err" id="err">Clave incorrecta.</div>
</div></div>

<script>
  var CLAVE='PRESENTA2026', N=11, i=0;
  var pad=function(n){return (n<10?'0':'')+n;};
  var src=function(n){return 'slide-cav-'+pad(n+1)+'.jpg';};
  var img=document.getElementById('lamina');

  function pinta(){
    img.src=src(i);
    document.getElementById('cnt').textContent=(i+1)+' / '+N;
    document.getElementById('bar').style.width=((i+1)/N*100)+'%';
    if(i+1<N){ var p=new Image(); p.src=src(i+1); } // precarga
  }
  function ir(d){ i=Math.min(N-1,Math.max(0,i+d)); pinta(); }
  function fs(){
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
    else{ document.exitFullscreen&&document.exitFullscreen(); }
  }
  document.getElementById('stage').addEventListener('click',function(){ ir(1); });
  document.getElementById('prevzone').addEventListener('click',function(e){ e.stopPropagation(); ir(-1); });
  document.addEventListener('keydown',function(e){
    if(document.getElementById('gate').style.display==='flex')return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')ir(1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp')ir(-1);
    else if(e.key==='f'||e.key==='F')fs();
    else if(e.key==='Home'){i=0;pinta();}
    else if(e.key==='End'){i=N-1;pinta();}
  });
  var tx=null;
  document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX;});
  document.addEventListener('touchend',function(e){ if(tx===null)return; var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40)ir(dx<0?1:-1); tx=null; });

  // acceso
  function autorizado(){ return sessionStorage.getItem('gp3_pres_ok')==='1'; }
  function entrar(){
    var v=(document.getElementById('clave').value||'').trim().toUpperCase();
    if(v===CLAVE){ sessionStorage.setItem('gp3_pres_ok','1'); document.getElementById('gate').style.display='none'; arranca(); }
    else{ document.getElementById('err').style.display='block'; }
  }
  function arranca(){
    pinta();
    var h=document.getElementById('hint'); h.classList.add('show');
    setTimeout(function(){h.classList.remove('show');},5000);
    var hud=document.getElementById('hud'); hud.classList.add('show');
    setTimeout(function(){hud.classList.remove('show');},5000);
  }
  try{
    var qk=new URLSearchParams(location.search).get('k');
    if(qk&&qk.trim().toUpperCase()===CLAVE){ sessionStorage.setItem('gp3_pres_ok','1'); history.replaceState(null,'',location.pathname); }
  }catch(e){}
  if(autorizado()){ arranca(); }
  else{ document.getElementById('gate').style.display='flex'; }
</script>
</body>
</html>
